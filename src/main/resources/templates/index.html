<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Viral Vault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body>
<header class="bg-dark text-white py-3">
    <div class="container">
        <span class="fs-4 fw-bold">Viral Vault</span>
    </div>
</header>

<main class="container py-5">
    <h1>Welcome to Viral Vault</h1>
    <p class="lead" th:text="${welcomeMessage}">Welcome message</p>

    <!-- Static example card; replace with products loaded from the agreed database later. -->
    <div class="row mt-4">
        <div class="col-sm-6 col-md-4 col-lg-3">
            <article class="card h-100">
                <img src="/images/product-placeholder.svg" class="card-img-top" alt="Example product image">
                <div class="card-body">
                    <h2 class="h5 card-title">Example product</h2>
                    <p class="card-text mb-1">$19.99</p>
                    <p class="card-text text-muted">Available: 12</p>
                </div>
            </article>
        </div>
    </div>
</main>
</body>
</html>
